<svg width="400" height="240" viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient18" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff9a9e;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#fecfef;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="240" fill="url(#bgGradient18)"/>
  
  <!-- Phone for Reporting -->
  <rect x="160" y="60" width="80" height="100" rx="12" fill="#1f2937"/>
  <rect x="170" y="75" width="60" height="70" fill="#10b981"/>
  <circle cx="200" cy="145" r="8" fill="#6b7280"/>
  
  <!-- Emergency Call Screen -->
  <circle cx="200" cy="100" r="20" fill="#ffffff"/>
  <text x="200" y="105" text-anchor="middle" fill="#ef4444" font-family="Arial" font-size="12" font-weight="bold">911</text>
  
  <!-- Report Button -->
  <rect x="180" y="120" width="40" height="15" fill="#ef4444" rx="3"/>
  <text x="200" y="130" text-anchor="middle" fill="white" font-family="Arial" font-size="8" font-weight="bold">REPORT</text>
  
  <!-- Steps/Numbers -->
  <circle cx="80" cy="80" r="15" fill="#fbbf24"/>
  <text x="80" y="85" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">1</text>
  
  <circle cx="80" cy="120" r="15" fill="#fbbf24"/>
  <text x="80" y="125" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">2</text>
  
  <circle cx="80" cy="160" r="15" fill="#fbbf24"/>
  <text x="80" y="165" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">3</text>
  
  <circle cx="320" cy="80" r="15" fill="#fbbf24"/>
  <text x="320" y="85" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">4</text>
  
  <circle cx="320" cy="120" r="15" fill="#fbbf24"/>
  <text x="320" y="125" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">5</text>
  
  <!-- Clock/Time Critical -->
  <circle cx="280" cy="60" r="15" fill="#ef4444"/>
  <path d="M280 52 L280 60 L286 66" stroke="white" stroke-width="2" fill="none"/>
  
  <!-- Documentation -->
  <rect x="100" y="140" width="30" height="40" fill="#ffffff" opacity="0.9" rx="2"/>
  <rect x="105" y="145" width="20" height="2" fill="#1e40af"/>
  <rect x="105" y="150" width="18" height="2" fill="#6b7280"/>
  <rect x="105" y="155" width="15" height="2" fill="#6b7280"/>
  
  <!-- Cyber Crime Portal -->
  <rect x="300" y="140" width="35" height="25" fill="#1e40af" rx="3"/>
  <rect x="305" y="145" width="25" height="15" fill="#ffffff"/>
  <rect x="308" y="148" width="19" height="2" fill="#1e40af"/>
  <rect x="308" y="152" width="15" height="2" fill="#1e40af"/>
  <rect x="308" y="156" width="17" height="2" fill="#1e40af"/>
  
  <!-- Title Area -->
  <rect x="20" y="190" width="360" height="40" fill="rgba(255,255,255,0.1)" rx="8"/>
  <text x="200" y="208" text-anchor="middle" fill="white" font-family="Arial" font-size="16" font-weight="bold">How to Report Fraud:</text>
  <text x="200" y="224" text-anchor="middle" fill="white" font-family="Arial" font-size="16" font-weight="bold">Step-by-Step Guide for Students</text>
</svg>