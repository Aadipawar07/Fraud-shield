<svg width="400" height="240" viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient10" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#ff6b6b;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#feca57;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="240" fill="url(#bgGradient10)"/>
  
  <!-- Smartphone with Loan App -->
  <rect x="150" y="50" width="100" height="120" rx="15" fill="#1f2937"/>
  <rect x="160" y="65" width="80" height="90" fill="#ef4444"/>
  
  <!-- Fake Loan App Interface -->
  <rect x="165" y="70" width="70" height="15" fill="#ffffff" opacity="0.9"/>
  <text x="200" y="80" text-anchor="middle" fill="#ef4444" font-family="Arial" font-size="8" font-weight="bold">INSTANT LOAN</text>
  
  <circle cx="200" cy="100" r="15" fill="#ffffff"/>
  <text x="200" y="105" text-anchor="middle" fill="#ef4444" font-family="Arial" font-size="12" font-weight="bold">₹</text>
  
  <rect x="170" y="120" width="60" height="8" fill="#ffffff" opacity="0.8"/>
  <rect x="170" y="135" width="50" height="8" fill="#ffffff" opacity="0.8"/>
  
  <!-- Trap/Warning Elements -->
  <polygon points="100,80 120,100 100,120 80,100" fill="#ef4444"/>
  <text x="100" y="105" text-anchor="middle" fill="white" font-family="Arial" font-size="16" font-weight="bold">!</text>
  
  <polygon points="300,80 320,100 300,120 280,100" fill="#ef4444"/>
  <text x="300" y="105" text-anchor="middle" fill="white" font-family="Arial" font-size="16" font-weight="bold">!</text>
  
  <!-- Chain/Trap Symbol -->
  <ellipse cx="130" cy="140" rx="8" ry="12" fill="none" stroke="#374151" stroke-width="3"/>
  <ellipse cx="145" cy="140" rx="8" ry="12" fill="none" stroke="#374151" stroke-width="3"/>
  <ellipse cx="255" cy="140" rx="8" ry="12" fill="none" stroke="#374151" stroke-width="3"/>
  <ellipse cx="270" cy="140" rx="8" ry="12" fill="none" stroke="#374151" stroke-width="3"/>
  
  <!-- Title Area -->
  <rect x="20" y="190" width="360" height="40" fill="rgba(255,255,255,0.1)" rx="8"/>
  <text x="200" y="208" text-anchor="middle" fill="white" font-family="Arial" font-size="16" font-weight="bold">Loan Traps: Spot Fake</text>
  <text x="200" y="224" text-anchor="middle" fill="white" font-family="Arial" font-size="16" font-weight="bold">Lending Apps</text>
</svg>