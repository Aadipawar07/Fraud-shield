<svg width="400" height="240" viewBox="0 0 400 240" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient13" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#667eea;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#764ba2;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="400" height="240" fill="url(#bgGradient13)"/>
  
  <!-- RBI Building/Institution -->
  <rect x="160" y="80" width="80" height="60" fill="#ffffff" opacity="0.95"/>
  <rect x="170" y="50" width="60" height="30" fill="#1e40af"/>
  <text x="200" y="68" text-anchor="middle" fill="white" font-family="Arial" font-size="12" font-weight="bold">RBI</text>
  
  <!-- Pillars -->
  <rect x="165" y="90" width="8" height="45" fill="#1e40af"/>
  <rect x="180" y="90" width="8" height="45" fill="#1e40af"/>
  <rect x="195" y="90" width="8" height="45" fill="#1e40af"/>
  <rect x="210" y="90" width="8" height="45" fill="#1e40af"/>
  <rect x="225" y="90" width="8" height="45" fill="#1e40af"/>
  
  <!-- Verification Checkmark -->
  <circle cx="120" cy="100" r="20" fill="#10b981"/>
  <path d="M110 100 L116 106 L130 92" stroke="white" stroke-width="4" fill="none"/>
  
  <!-- Website/App Icons -->
  <rect x="280" y="80" width="40" height="40" fill="#ffffff" opacity="0.9" rx="8"/>
  <rect x="285" y="85" width="30" height="20" fill="#3b82f6"/>
  <rect x="288" y="110" width="24" height="4" fill="#d1d5db"/>
  <rect x="288" y="116" width="18" height="4" fill="#d1d5db"/>
  
  <!-- Magnifying Glass -->
  <circle cx="80" cy="140" r="15" fill="none" stroke="#ffffff" stroke-width="3"/>
  <path d="M92 152 L102 162" stroke="#ffffff" stroke-width="3"/>
  
  <!-- Warning/Fake Sites -->
  <rect x="300" y="130" width="30" height="30" fill="#ef4444" opacity="0.8" rx="4"/>
  <path d="M310 140 L320 150 M320 140 L310 150" stroke="white" stroke-width="3"/>
  
  <!-- Title Area -->
  <rect x="20" y="190" width="360" height="40" fill="rgba(255,255,255,0.1)" rx="8"/>
  <text x="200" y="208" text-anchor="middle" fill="white" font-family="Arial" font-size="16" font-weight="bold">How to Check if Website/App</text>
  <text x="200" y="224" text-anchor="middle" fill="white" font-family="Arial" font-size="16" font-weight="bold">is RBI-Approved</text>
</svg>